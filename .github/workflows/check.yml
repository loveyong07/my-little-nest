name: check

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Logic tests, build, build-artifact checks, Sites worker tests
        run: npm run check
      - name: Fail on high or critical dependency advisories
        run: npm audit --audit-level=high
