name: check

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Lint, formatting, logic tests, build and runtime compatibility
        # Public canaries: artifact checks fail if server-only values enter dist/client.
        env:
          X_BEARER_TOKEN: BUILD_ONLY_X_TOKEN_CANARY_20261013
          X_MEDIA_SIGNING_SECRET: BUILD_ONLY_MEDIA_SECRET_CANARY_20261013
          BLOB_READ_WRITE_TOKEN: BUILD_ONLY_BLOB_TOKEN_CANARY_20261022
        run: npm run check
      - name: Fail on high or critical dependency advisories
        run: npm audit --audit-level=high
