name: check

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Lint, formatting, logic tests, build and runtime compatibility
        # Public canaries: artifact checks fail if server-only values enter dist/client.
        env:
          X_BEARER_TOKEN: BUILD_ONLY_X_TOKEN_CANARY_20261013
          X_MEDIA_SIGNING_SECRET: BUILD_ONLY_MEDIA_SECRET_CANARY_20261013
          X_MEDIA_SIGNING_SECRET_PREVIOUS: BUILD_ONLY_PREVIOUS_MEDIA_SECRET_CANARY_20261119
          BLOB_READ_WRITE_TOKEN: BUILD_ONLY_BLOB_TOKEN_CANARY_20261022
          TOUCHGAL_API_TOKEN: BUILD_ONLY_TOUCHGAL_TOKEN_CANARY_20261119
        run: npm run check
      - name: Audit production and development dependencies
        run: npm run audit:ci
      - name: Install browser for interaction checks
        run: npx playwright-core install --with-deps chrome
      - name: Browser interaction and Article image checks
        env:
          QA_BROWSER: chrome
        run: npm run test:browser
